services:
  api:
    build:
      context: ./backend
      dockerfile: src/BookEase.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Jwt__Key: ${JWT_KEY:?Set JWT_KEY in .env (copy .env.example)}
      Seed__Enabled: ${SEED_ENABLED:-true}
      Swagger__Enabled: "true"
      Cors__AllowedOrigins__0: ${FRONTEND_URL:-http://localhost:8080}
      App__FrontendUrl: ${FRONTEND_URL:-http://localhost:8080}
      Stripe__SecretKey: ${STRIPE_SECRET_KEY:-}
      Stripe__PublishableKey: ${STRIPE_PUBLISHABLE_KEY:-}
      Stripe__WebhookSecret: ${STRIPE_WEBHOOK_SECRET:-}
      # Simulated payments, only honoured while Stripe__SecretKey is empty.
      Payments__AllowDemo: ${PAYMENTS_ALLOW_DEMO:-true}
      Smtp__Host: mailpit
      Smtp__Port: "1025"
      Smtp__UseTls: "false"
    volumes:
      - bookease-data:/data
    ports:
      - "5080:8080"
    depends_on:
      - mailpit

  client:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - api

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"   # web UI: every email the app sends shows up here
      - "1025:1025"

volumes:
  bookease-data:
