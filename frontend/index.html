<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BookEase · Online appointment booking</title>
    <meta name="description" content="Choose a service, pick a time and pay online. Free changes up to the cancellation window." />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f8f6f1" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#131614" media="(prefers-color-scheme: dark)" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="BookEase" />
    <meta property="og:title" content="BookEase · Online appointment booking" />
    <meta property="og:description" content="Choose a service, pick a time and pay online." />
    <meta name="twitter:card" content="summary" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('bookease.theme');
          var dark = stored === 'dark' || (stored !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          var root = document.documentElement;
          if (dark) root.classList.add('dark');
          root.style.colorScheme = dark ? 'dark' : 'light';
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
